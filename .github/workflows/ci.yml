name: CI

on:
  # Pull requests only, not the push that merging one makes: the pull request run already tested
  # the merge result, and a second 20-minute run of the same tree on main bought nothing.
  pull_request:
    branches: [main]
  # Run by hand on any branch (Actions ▸ CI ▸ Run workflow), without opening a pull request.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: DirnexCore (swift test)
    # One of GitHub's Macs, or the Mac runner when the repository variable DIRNEX_RUNNER is `mac`
    # (docs/RELEASING.md ▸ The Mac runner), for all three jobs. On 2026-10-27 and 28 runs here
    # waited hours for a GitHub Mac, then were cancelled.
    runs-on: ${{ vars.DIRNEX_RUNNER == 'mac' && fromJSON('["self-hosted", "dirnex-mac"]') || 'macos-26' }}
    # Without a limit a stuck run sits for GitHub's six hours, as on 2026-10-28. The job takes 12 to
    # 21 minutes, most of it the release build below.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Test DirnexCore
        # 3 to 6 minutes when it passes. On 2026-10-27 and 28 three runs in a row stopped a second
        # into the tests, with not one passing. A local run with three cooperative threads free,
        # as here, stalled the same way on two tests waiting for work sent to a global queue,
        # which starts nothing while those threads are all busy (docs/NOTES.md ▸ Testing).
        timeout-minutes: 20
        run: swift test --package-path DirnexCore
      - name: Performance budgets (release)
        # The M1 hot-path budgets (PerformanceBudgetTests) only enforce in optimized
        # builds; a debug run prints its numbers but compiles the assertions out.
        run: swift test -c release --package-path DirnexCore --filter PerformanceBudget

  app:
    name: App (xcodebuild test)
    runs-on: ${{ vars.DIRNEX_RUNNER == 'mac' && fromJSON('["self-hosted", "dirnex-mac"]') || 'macos-26' }}
    # The watchdog below stops a stuck run at 25 minutes; this is only the backstop. Without it a
    # stuck run sits for GitHub's six hours, as on 2026-09-30 and 2026-10-01.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Build & test
        # A test that never returns stops the whole suite without failing anything: on 2026-09-30
        # every test went quiet 5 seconds in and nothing printed for four hours. The runner has
        # only three cooperative threads, so three tests blocked on a child process are enough to
        # freeze every other test (the 2026-10-02 sample). So the run is watched, and past 25
        # minutes the test host's threads are sampled and the screen captured (in the `hang`
        # artifact) before it's stopped. The main thread's stack goes into the log too.
        env:
          # Reaches the tests as `DIRNEX_CI` (xcodebuild strips the prefix), for the suites that
          # must not run on a CI machine, such as SFTPPasswordMechanismTests.
          TEST_RUNNER_DIRNEX_CI: "1"
        run: |
          set -o pipefail
          # The Mac runner keeps its home between jobs, so the build goes in this job's own folder,
          # emptied when the job ends: a .stringsdata left from a deleted file would fail the
          # catalog check below. The marker lets Crash reports skip reports from earlier runs.
          touch "$RUNNER_TEMP/tests-started"
          # The host shares the installed app's defaults domain. Compare outside the host so
          # writes before the first test or during shutdown cannot escape the check.
          defaults export com.dirnex.Dirnex TestDefaults-before.plist
          check_defaults() {
            test_status=$?
            defaults export com.dirnex.Dirnex TestDefaults-after.plist || exit 1
            python3 scripts/check_defaults_unchanged.py TestDefaults-before.plist TestDefaults-after.plist || exit 1
            exit "$test_status"
          }
          trap check_defaults EXIT
          # One test at a time. The runner has three cooperative threads, and a synchronous test
          # holds one for as long as it blocks, so three at once leave none: then work on a global
          # queue — `BlockingWork`, a pipe drain — never starts, and tests that wait for it time out
          # (2026-10-02: six of them, at about a minute each). A Mac with many cores is spared,
          # so local runs stay parallel (docs/NOTES.md ▸ Testing).
          xcodebuild test \
            -project Dirnex.xcodeproj \
            -scheme Dirnex \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath TestResults.xcresult &
          tests=$!
          deadline=$((SECONDS + 25 * 60))
          while kill -0 "$tests" 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The app tests ran past 25 minutes. Sampling the test host, then stopping them."
              mkdir -p hang
              screencapture -x hang/screen.png || echo "No screenshot (no Screen Recording permission?)."
              # This user's copies only: on the Mac runner another user's Dirnex may be running.
              for pid in $(pgrep -x -u "$(id -u)" Dirnex); do
                sample "$pid" 10 -file "hang/sample-$pid.txt" || true
                echo "::group::Main thread of Dirnex $pid"
                awk '/^ +[0-9]+ Thread_/ { on = /com.apple.main-thread/ } /^Total number/ { on = 0 } on' \
                  "hang/sample-$pid.txt" | head -200 || true
                echo "::endgroup::"
                # The tests that held the run on 2026-10-02 were each waiting for a child process
                # (bsdtar, sftp) whose exit never reached them. Whether such a child is still
                # running (S, R), exited but not reaped (Z), or gone says where the exit was lost.
                echo "::group::Child processes of Dirnex $pid"
                ps -A -o pid=,ppid=,stat=,etime=,command= | awk -v parent="$pid" '$2 == parent' || true
                echo "::endgroup::"
                for child in $(pgrep -P "$pid"); do
                  sample "$child" 3 -file "hang/sample-child-$child.txt" > /dev/null 2>&1 || true
                done
              done
              kill "$tests" || true
              pkill -x -u "$(id -u)" Dirnex || true
              exit 1
            fi
            sleep 20
          done
          wait "$tests"
      # Reads the .stringsdata the build above emitted, so it runs after it rather than in the
      # lint job. A key the compiler extracted but the catalog never received renders in English
      # inside every translated build, with no error and a perfect English screenshot.
      - name: Every extracted string is in the catalog
        run: python3 scripts/check_localization_keys.py --derived-data "$RUNNER_TEMP/DerivedData"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
      # A crash ends the test host with only "Test crashed with signal segv." in the log
      # (2026-10-02, in TreeRefreshReachTests, which passes on its own and in a full local run).
      # macOS keeps a report on the runner, so its crashing thread goes in the log and the report
      # in the `crashes` artifact.
      - name: Crash reports
        if: always()
        run: |
          mkdir -p crashes
          if [ ! -f "$RUNNER_TEMP/tests-started" ]; then
            echo "The tests never started."
            exit 0
          fi
          # Newer than the tests' start: the Mac runner keeps every earlier run's reports too.
          find ~/Library/Logs/DiagnosticReports -maxdepth 2 -name 'Dirnex-*.ips' \
            -newer "$RUNNER_TEMP/tests-started" -exec cp {} crashes/ \;
          if ls crashes/*.ips > /dev/null 2>&1; then
            python3 scripts/print_crash_reports.py crashes/*.ips
          else
            echo "No Dirnex crash reports."
          fi
      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crashes
          path: crashes
          if-no-files-found: ignore
      - name: Upload what a stuck run left
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hang
          path: hang
          if-no-files-found: ignore

  lint:
    name: Lint (SwiftFormat + SwiftLint)
    runs-on: ${{ vars.DIRNEX_RUNNER == 'mac' && fromJSON('["self-hosted", "dirnex-mac"]') || 'macos-26' }}
    env:
      # SwiftFormat is pinned, because its `indent` rule changes between patch releases: on
      # 2026-10-28, 0.64.0 (the runner image's) and 0.64.4 (Homebrew's) each rejected the other's
      # layout of a guard condition with wrapped arguments. SwiftLint is pinned too, since the Mac
      # runner can't `brew install` (Homebrew there belongs to another macOS user), and so a new
      # release can't fail a pull request that changed nothing. To move a pin, take the asset's
      # digest from `gh api repos/<owner>/<repo>/releases/tags/<version>`.
      SWIFTFORMAT_VERSION: 0.64.4
      SWIFTFORMAT_SHA256: bb42fbfb0b9d5f1b8b83db3147087220ea414916fce8c5cf71abaea5ad5a3175
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          # Name, address, digest. Each lands in this job's own folder, ahead of anything on PATH.
          install_tool() {
            archive="$RUNNER_TEMP/$1.zip"
            curl -fsSL -o "$archive" "$2"
            echo "$3  $archive" | shasum -a 256 -c -
            unzip -q "$archive" -d "$RUNNER_TEMP/$1"
            echo "$RUNNER_TEMP/$1" >> "$GITHUB_PATH"
          }
          install_tool swiftformat \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip" \
            "$SWIFTFORMAT_SHA256"
          install_tool swiftlint \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip" \
            "$SWIFTLINT_SHA256"
      - name: SwiftFormat (lint mode)
        # The image ships its own swiftformat in /opt/homebrew/bin, and so may the Mac runner, so
        # check which one runs.
        run: |
          test "$(swiftformat --version)" = "$SWIFTFORMAT_VERSION"
          swiftformat --lint .
      - name: SwiftLint
        run: |
          test "$(swiftlint version)" = "$SWIFTLINT_VERSION"
          swiftlint --strict
      # A pure source scan, so it needs no build. `NSAlert` binds Escape by matching the byte
      # string "Cancel", so an alert that skips `enableEscapeToCancel()` is Escape-dead in every
      # language but English — invisible at build time and in any English screenshot.
      - name: Every alert can be dismissed with Escape
        run: python3 scripts/check_alert_escape.py
      # Also a pure source scan. AppKit's bare text-field initializers wrap, so a name longer than
      # the field hides its tail on a second line the field is too short to show — perfect in any
      # screenshot taken with a short name, and green in both suites.
      - name: Every entry field scrolls instead of wrapping
        run: python3 scripts/check_single_line_fields.py
      # Also a pure source scan. A defaults suite named with a fresh UUID leaves a plist in
      # ~/Library/Preferences on every test run, even after `removePersistentDomain` — 19,046 of
      # them had built up by 2026-09-13, with nothing in the repo or either suite to show it.
      - name: Test defaults suites have fixed names
        run: python3 scripts/check_test_defaults_suites.py
